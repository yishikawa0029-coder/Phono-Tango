<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Phono-Tango — 中学英単語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAEDF7;
    --surface:#FFFFFF;
    --ink:#1E2340;
    --muted:#757B9A;
    --line:#E2E6F2;
    --primary:#4A3DCB;
    --primary-soft:#ECEAFB;
    --accent:#FF9F45;
    --correct:#16B981;
    --correct-soft:#E2F7EF;
    --wrong:#F35069;
    --wrong-soft:#FEE9ED;
    --radius:20px;
    --shadow:0 10px 30px -12px rgba(30,35,64,.22);
    --jp:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --en:"Outfit",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--jp);
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 100% 0%, #F0ECFB 0%, transparent 55%),
      radial-gradient(110% 70% at 0% 100%, #E4F5EF 0%, transparent 50%),
      var(--bg);
    min-height:100dvh;
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
  }
  .app{
    width:100%;max-width:440px;
    display:flex;flex-direction:column;
    min-height:100dvh;padding:18px 0 28px;
  }
  /* ---------- shared ---------- */
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .brand .mark{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(145deg,var(--primary),#6F63E8);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;
    box-shadow:0 6px 14px -4px rgba(74,61,203,.55);
  }
  .brand h1{font-size:18px;font-weight:800;letter-spacing:.02em}
  .brand span{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}

  .screen{display:none;flex:1;flex-direction:column;animation:rise .32s ease both}
  .screen.active{display:flex}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .card{
    background:var(--surface);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px;
  }
  .card + .card{margin-top:14px}

  .btn{
    font-family:var(--jp);font-weight:700;font-size:16px;
    border:none;border-radius:16px;padding:15px;width:100%;
    cursor:pointer;transition:transform .12s ease,box-shadow .2s ease,background .2s;
    color:#fff;background:var(--primary);
    box-shadow:0 8px 18px -8px rgba(74,61,203,.7);
  }
  .btn:active{transform:translateY(2px) scale(.99)}
  .btn.ghost{background:transparent;color:var(--primary);box-shadow:none;border:2px solid var(--line)}
  .btn.amber{background:var(--accent);box-shadow:0 8px 18px -8px rgba(255,159,69,.7)}
  .btn:disabled{opacity:.45;cursor:default}
  button:focus-visible,.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* ---------- home ---------- */
  .stat-row{display:flex;gap:12px;margin-bottom:14px}
  .stat{flex:1;background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:center}
  .stat .num{font-family:var(--en);font-weight:700;font-size:26px;color:var(--primary);line-height:1}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:6px;font-weight:500}

  .section-label{font-size:12px;color:var(--muted);font-weight:700;margin:0 4px 8px}

  .set-pick{position:relative}
  .set-pick::after{content:"▾";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--primary);font-size:14px;pointer-events:none}
  #setSelect{
    width:100%;font-family:var(--jp);font-weight:700;font-size:15px;color:var(--ink);
    background:var(--surface);border:2px solid var(--line);border-radius:15px;
    padding:14px 38px 14px 16px;cursor:pointer;-webkit-appearance:none;appearance:none;
    box-shadow:var(--shadow);transition:border-color .15s}
  #setSelect:focus{outline:none;border-color:var(--primary)}

  .mode-grid{display:flex;flex-direction:column;gap:12px}
  .mode{
    text-align:left;background:var(--surface);border:2px solid var(--line);
    border-radius:18px;padding:16px;cursor:pointer;display:flex;gap:14px;align-items:center;
    transition:border-color .18s,transform .12s,background .18s;font-family:var(--jp);
  }
  .mode:active{transform:scale(.99)}
  .mode[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
  .mode .ico{font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#F1F3FB;flex:none}
  .mode .t{font-weight:800;font-size:16px}
  .mode .d{font-size:12px;color:var(--muted);margin-top:2px}

  .pills{display:flex;gap:8px;margin-top:6px}
  .pill{
    flex:1;border:2px solid var(--line);background:var(--surface);border-radius:13px;
    padding:11px 0;font-family:var(--en);font-weight:700;font-size:15px;color:var(--ink);
    cursor:pointer;transition:border-color .15s,background .15s}
  .pill[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

  .home-foot{margin-top:auto;padding-top:18px;display:flex;gap:10px}
  .home-foot button{flex:1;font-size:13px;padding:12px}

  /* ---------- quiz ---------- */
  .quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .quiz-top .count{font-family:var(--en);font-weight:700;font-size:13px;color:var(--muted);flex:none}
  .bar{flex:1;height:9px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#6F63E8);border-radius:99px;transition:width .35s ease}
  .quiz-top .quit{flex:none;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px}

  .prompt{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:34px 20px;text-align:center;margin-bottom:16px;min-height:150px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .prompt .word{font-family:var(--en);font-weight:700;font-size:40px;letter-spacing:.01em;word-break:break-word;line-height:1.15}
  .prompt .word.long{font-size:28px}
  .prompt .word.xlong{font-size:21px}
  .prompt .pos{font-size:12px;color:var(--muted);font-weight:500;background:#F1F3FB;padding:3px 10px;border-radius:99px}
  .prompt .hint{font-size:13px;color:var(--muted);font-weight:500}
  .word-spk{margin-top:12px;background:var(--primary-soft);color:var(--primary);border:none;border-radius:99px;padding:9px 18px;font-family:var(--jp);font-weight:700;font-size:14px;cursor:pointer;transition:transform .1s}
  .word-spk:active{transform:scale(.96)}

  /* audio orb (発音モード signature) */
  .orb{
    width:108px;height:108px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#6F63E8,var(--primary));
    color:#fff;display:grid;place-items:center;position:relative;
    box-shadow:0 12px 26px -8px rgba(74,61,203,.7);transition:transform .12s}
  .orb:active{transform:scale(.95)}
  .orb svg{width:42px;height:42px}
  .orb::before,.orb::after{
    content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);opacity:0}
  .orb.playing::before{animation:ring 1.4s ease-out infinite}
  .orb.playing::after{animation:ring 1.4s ease-out .5s infinite}
  @keyframes ring{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
  .replay{margin-top:4px;background:none;border:none;color:var(--primary);font-weight:700;font-size:13px;cursor:pointer;font-family:var(--jp)}

  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{
    font-family:var(--jp);font-weight:700;font-size:16px;text-align:left;
    background:var(--surface);border:2px solid var(--line);border-radius:15px;
    padding:15px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;
    transition:border-color .15s,background .15s,transform .1s}
  .choice:active{transform:scale(.99)}
  .choice .k{font-family:var(--en);font-weight:700;font-size:13px;color:var(--muted);
    width:24px;height:24px;border-radius:8px;background:#F1F3FB;display:grid;place-items:center;flex:none}
  .choice.correct{border-color:var(--correct);background:var(--correct-soft);animation:pop .3s ease}
  .choice.correct .k{background:var(--correct);color:#fff}
  .choice.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
  .choice.wrong .k{background:var(--wrong);color:#fff}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}

  .feedback{text-align:center;font-weight:800;font-size:15px;margin-top:14px;min-height:22px}
  .feedback.ok{color:var(--correct)}
  .feedback.ng{color:var(--wrong)}
  .example{display:none;background:var(--primary-soft);border-radius:14px;padding:14px 16px;margin-top:12px;position:relative;animation:rise .25s ease both}
  .example .ex-en{font-family:var(--en);font-size:15px;color:var(--ink);line-height:1.5;padding-right:30px}
  .example .ex-en b{color:var(--primary);font-weight:700}
  .example .ex-ja{font-size:13px;color:var(--muted);margin-top:6px;font-weight:500}
  .ex-spk{position:absolute;top:11px;right:11px;background:none;border:none;font-size:18px;cursor:pointer;line-height:1;padding:2px}
  #nextBtn{margin-top:14px}

  /* ---------- result ---------- */
  .result-head{text-align:center;padding:8px 0 4px}
  .result-head .emoji{font-size:46px}
  .result-head h2{font-size:22px;font-weight:800;margin-top:6px}
  .result-head p{color:var(--muted);font-size:13px;margin-top:4px;font-weight:500}
  .score-ring{display:flex;justify-content:center;margin:16px 0}
  .ring{position:relative;width:150px;height:150px}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-family:var(--en);font-size:34px;font-weight:700;color:var(--ink)}
  .ring .pct s{font-size:12px;color:var(--muted);text-decoration:none;font-weight:500;margin-top:2px}
  .review-title{font-size:13px;font-weight:700;margin:4px 4px 10px;color:var(--ink)}
  .review-item{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
  .review-item:last-child{border-bottom:none}
  .review-item .w{font-family:var(--en);font-weight:700;font-size:16px}
  .review-item .m{color:var(--muted);font-size:14px;font-weight:500}
  .review-empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0;font-weight:500}
  .result-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px}

  /* ---------- edit list ---------- */
  .edit-screen textarea{
    width:100%;min-height:230px;border:2px solid var(--line);border-radius:14px;
    padding:14px;font-family:var(--en),var(--jp);font-size:14px;line-height:1.6;resize:vertical;color:var(--ink)}
  .edit-screen textarea:focus{outline:none;border-color:var(--primary)}
  .help{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 4px 14px}
  .help code{background:#F1F3FB;padding:1px 6px;border-radius:6px;font-family:var(--en)}
  .edit-msg{font-size:13px;font-weight:700;text-align:center;min-height:20px;margin-top:10px}
  .edit-msg.ok{color:var(--correct)}.edit-msg.ng{color:var(--wrong)}
  .top-back{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .top-back button{background:none;border:none;color:var(--primary);font-weight:700;font-size:15px;cursor:pointer;font-family:var(--jp);padding:4px 0}
  .top-back h2{font-size:17px;font-weight:800}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
<meta name="theme-color" content="#4A3DCB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phono-Tango">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="mark">P</div>
    <div><h1>Phono-Tango<span>中学英単語 — 聞いて・選んで・覚える</span></h1></div>
  </div>

  <!-- ============ HOME ============ -->
  <section class="screen active" id="home">
    <div class="stat-row">
      <div class="stat"><div class="num" id="statWords">0</div><div class="lbl">登録単語</div></div>
      <div class="stat"><div class="num" id="statAcc">–</div><div class="lbl">通算正答率</div></div>
      <div class="stat"><div class="num" id="statWeak">0</div><div class="lbl">苦手な単語</div></div>
    </div>

    <p class="section-label">単語帳をえらぶ</p>
    <div class="set-pick">
      <select id="setSelect" aria-label="単語帳をえらぶ"></select>
    </div>

    <p class="section-label" style="margin-top:18px">モードをえらぶ</p>
    <div class="mode-grid">
      <button class="mode" data-mode="choice" aria-pressed="true">
        <span class="ico">📖</span>
        <span><span class="t">4択モード</span><span class="d">英単語を見て、意味を4つから選ぶ</span></span>
      </button>
      <button class="mode" data-mode="listen" aria-pressed="false">
        <span class="ico">🔊</span>
        <span><span class="t">発音モード</span><span class="d">発音を聞いて、意味を4つから選ぶ</span></span>
      </button>
    </div>

    <p class="section-label" style="margin-top:18px">出題する範囲</p>
    <div class="pills" id="rangePills">
      <button class="pill" data-range="all" aria-pressed="true">すべての単語</button>
      <button class="pill" id="weakPill" data-range="weak" aria-pressed="false">苦手だけ (0)</button>
    </div>

    <p class="section-label" style="margin-top:18px">出題する数</p>
    <div class="pills" id="countPills">
      <button class="pill" data-count="10" aria-pressed="true">10問</button>
      <button class="pill" data-count="20" aria-pressed="false">20問</button>
      <button class="pill" data-count="50" aria-pressed="false">50問</button>
      <button class="pill" data-count="all" aria-pressed="false">ぜんぶ</button>
    </div>

    <div style="margin-top:18px"><button class="btn" id="startBtn">はじめる</button></div>

    <div class="home-foot">
      <button class="btn ghost" id="soundBtn">🔊 効果音 ON</button>
      <button class="btn ghost" id="editBtn">自分のリストを編集</button>
      <button class="btn ghost" id="resetBtn">記録をリセット</button>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section class="screen" id="quiz">
    <div class="quiz-top">
      <span class="count" id="qCount">1 / 10</span>
      <div class="bar"><i id="qBar" style="width:0%"></i></div>
      <button class="quit" id="quitBtn" aria-label="やめる">✕</button>
    </div>

    <div class="prompt" id="prompt"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="example" id="example"></div>
    <button class="btn" id="nextBtn" style="display:none">次へ</button>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" id="result">
    <div class="card">
      <div class="result-head">
        <div class="emoji" id="rEmoji">🎉</div>
        <h2 id="rTitle">おつかれさま！</h2>
        <p id="rSub"></p>
      </div>
      <div class="score-ring">
        <div class="ring">
          <svg width="150" height="150">
            <circle cx="75" cy="75" r="64" fill="none" stroke="#E2E6F2" stroke-width="14"/>
            <circle id="rRing" cx="75" cy="75" r="64" fill="none" stroke="#4A3DCB" stroke-width="14"
                    stroke-linecap="round" stroke-dasharray="402" stroke-dashoffset="402"/>
          </svg>
          <div class="pct"><b id="rPct">0%</b><s id="rFrac">0 / 0 問</s></div>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="review-title">この回でまちがえた単語</p>
      <div id="reviewList"></div>
    </div>

    <div class="result-foot">
      <button class="btn amber" id="retryBtn">もう一度（同じモード）</button>
      <button class="btn ghost" id="toHomeBtn">ホームにもどる</button>
    </div>
  </section>

  <!-- ============ EDIT LIST ============ -->
  <section class="screen edit-screen" id="edit">
    <div class="top-back">
      <button id="editBack">‹ もどる</button>
      <h2>自分のリストを編集</h2>
    </div>
    <div class="card">
      <textarea id="listInput" spellcheck="false"></textarea>
      <p class="help">
        1行に1単語。<code>英単語 , 意味 , 品詞</code> の順でカンマ区切り。<br>
        品詞は省略できます（例：<code>apple,りんご,名詞</code>）。<br>
        ※2語以上ないと4択を作れません。
      </p>
      <button class="btn" id="saveListBtn">この内容で保存</button>
      <div class="edit-msg" id="editMsg"></div>
      <button class="btn ghost" id="loadDefaultBtn" style="margin-top:10px">サンプルを挿入</button>
    </div>
  </section>
</div>

<script>
"use strict";

/* ====== サンプル単語リスト（自分のリストに差し替え可） ====== */
const DEFAULT_WORDS = [
  {word:"apple",     meaning:"りんご",        pos:"名詞"},
  {word:"school",    meaning:"学校",          pos:"名詞"},
  {word:"friend",    meaning:"友達",          pos:"名詞"},
  {word:"weather",   meaning:"天気",          pos:"名詞"},
  {word:"future",    meaning:"未来",          pos:"名詞"},
  {word:"run",       meaning:"走る",          pos:"動詞"},
  {word:"study",     meaning:"勉強する",      pos:"動詞"},
  {word:"remember",  meaning:"覚えている",    pos:"動詞"},
  {word:"finish",    meaning:"終える",        pos:"動詞"},
  {word:"borrow",    meaning:"借りる",        pos:"動詞"},
  {word:"decide",    meaning:"決める",        pos:"動詞"},
  {word:"beautiful", meaning:"美しい",        pos:"形容詞"},
  {word:"difficult", meaning:"難しい",        pos:"形容詞"},
  {word:"important", meaning:"重要な",        pos:"形容詞"},
  {word:"enough",    meaning:"十分な",        pos:"形容詞"},
  {word:"favorite",  meaning:"お気に入りの",  pos:"形容詞"},
  {word:"quickly",   meaning:"速く",          pos:"副詞"},
  {word:"always",    meaning:"いつも",        pos:"副詞"},
  {word:"carefully", meaning:"注意深く",      pos:"副詞"},
  {word:"between",   meaning:"〜の間に",      pos:"前置詞"},
];

/* ====== 内蔵単語帳データ ====== */
const SETS = [
  {id:"f1", label:"基礎 中1必修", words:[
    {word:"father",meaning:"父",pos:"名詞",ex:"My father is a doctor.",ja:"私の父は医者だ。",ipa:"ˈfɑðər",note:"略して dad。grandfather=祖父"},
    {word:"mother",meaning:"母",pos:"名詞",ex:"My mother cooks well.",ja:"母は料理が上手だ。",ipa:"ˈməðər",note:"略して mom。mother tongue=母語"},
    {word:"brother",meaning:"兄・弟",pos:"名詞",ex:"I have one brother.",ja:"私には兄が一人いる。",ipa:"ˈbrəðər",note:"兄・弟どちらも。big/little brother で区別"},
    {word:"sister",meaning:"姉・妹",pos:"名詞",ex:"She is my sister.",ja:"彼女は私の姉だ。",ipa:"ˈsɪstər",note:"姉・妹どちらも。sister city=姉妹都市"},
    {word:"grandfather",meaning:"祖父",pos:"名詞",ex:"My grandfather is eighty.",ja:"祖父は80歳だ。",ipa:"ˈgrænˌfɑðər",note:"grand(大きな)+father。略 grandpa"},
    {word:"grandmother",meaning:"祖母",pos:"名詞",ex:"My grandmother lives near here.",ja:"祖母はこの近くに住んでいる。",ipa:"ˈgrændˌməðər",note:"grand+mother。略 grandma"},
    {word:"son",meaning:"息子",pos:"名詞",ex:"They have one son.",ja:"彼らには息子が一人いる。",ipa:"sən",note:"「息子」。daughter(娘)とセットで"},
    {word:"daughter",meaning:"娘",pos:"名詞",ex:"His daughter is six.",ja:"彼の娘は6歳だ。",ipa:"ˈdɔtər",note:"「娘」。gh は発音しない黙字"},
    {word:"baby",meaning:"赤ちゃん",pos:"名詞",ex:"The baby is sleeping.",ja:"赤ちゃんは眠っている。",ipa:"ˈbeɪbi",note:"複数は babies（y→ies）"},

    {word:"have been to",meaning:"〜へ行ったことがある",pos:"熟語",ex:"I have been to Okinawa.",ja:"私は沖縄へ行ったことがある。",ipa:"",note:"経験のhave＋been→「〜へ行ったことがある」"},
    {word:"not always",meaning:"いつも〜とは限らない",pos:"熟語",ex:"The rich are not always happy.",ja:"金持ちがいつも幸せとは限らない。",ipa:"",note:"always を部分否定→「いつも〜とは限らない」"},
    {word:"no longer",meaning:"もはや〜ない",pos:"熟語",ex:"He no longer lives here.",ja:"彼はもはやここに住んでいない。",ipa:"",note:"longer(もはや)を否定→「もはや〜ない」"},
    {word:"both",meaning:"両方とも",pos:"熟語",ex:"Both of them are kind.",ja:"彼らは両方とも親切だ。",ipa:"boʊθ",note:"both(両方)→「両方とも」"},
    {word:"either",meaning:"どちらか",pos:"熟語",ex:"You can take either book.",ja:"あなたはどちらかの本を取っていい。",ipa:"ˈiðər",note:"どちらか一方→「どちらか」"},
    {word:"neither",meaning:"どちらも〜ない",pos:"熟語",ex:"Neither answer is correct.",ja:"どちらの答えも正しくない。",ipa:"ˈniðər",note:"not＋either→「どちらも〜ない」"},
    {word:"in fact",meaning:"実際は",pos:"熟語",ex:"In fact, he was right.",ja:"実際は、彼は正しかった。",ipa:"",note:"fact(事実)→「実際は」"},
    {word:"after all",meaning:"結局",pos:"熟語",ex:"After all, we won the game.",ja:"結局、私たちは試合に勝った。",ipa:"",note:"all(すべて)の後で→「結局」"},
    {word:"at least",meaning:"少なくとも",pos:"熟語",ex:"Sleep at least seven hours.",ja:"少なくとも7時間眠りなさい。",ipa:"",note:"least(最小)→「少なくとも」"},
  ]},
];


const CUSTOM_ID = "custom";
const LS_WORDS = "eitango_words_v1";   // 自分のリスト
const LS_STATS = "eitango_stats_v1";
const LS_SET   = "eitango_set_v1";     // 選択中の単語帳
const LS_SOUND = "eitango_sound_v1";   // 効果音 ON/OFF

/* ====== 状態 ====== */
let activeSet = localStorage.getItem(LS_SET) || "ex1";
let WORDS = [];
let stats = loadStats();              // { word: {seen, correct, lastWrong} }
let mode = "choice";                  // "choice" | "listen"
let countSel = 10;                    // 10 | 20 | "all"
let rangeSel = "all";                 // "all" | "weak"（苦手だけ）
let queue = [];                       // 出題する単語の配列
let idx = 0;
let sessionWrong = [];                // この回でまちがえた単語
let answered = false;
let soundOn = localStorage.getItem(LS_SOUND) !== "off";

/* ====== ストレージ ====== */
function getCustomWords(){
  try{ const v=JSON.parse(localStorage.getItem(LS_WORDS)); if(Array.isArray(v)&&v.length>=2) return v; }catch(e){}
  return [];
}
function applySet(){
  if(activeSet===CUSTOM_ID){ WORDS = getCustomWords(); }
  else { const s=SETS.find(x=>x.id===activeSet); WORDS = s ? s.words.slice() : SETS[0].words.slice(); }
}
function loadStats(){
  try{ return JSON.parse(localStorage.getItem(LS_STATS)) || {}; }catch(e){ return {}; }
}
function saveStats(){ localStorage.setItem(LS_STATS, JSON.stringify(stats)); }

/* ====== 便利関数 ====== */
const $ = s => document.querySelector(s);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $("#"+id).classList.add("active"); }

/* ====== 音声（Web Speech API / TTS） ====== */
let enVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v=>/^en[-_]?US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9; u.pitch = 1;
  if(enVoice) u.voice = enVoice;
  const orb = $("#orbBtn");
  if(orb){ orb.classList.add("playing"); u.onend = ()=>orb.classList.remove("playing"); }
  speechSynthesis.speak(u);
}

/* ====== 効果音（Web Audioで合成） ====== */
let audioCtx = null;
function initAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
// 最初の操作の瞬間に音声を解放しておく（自動再生制限対策）
["pointerdown","touchstart","keydown"].forEach(ev=>
  document.addEventListener(ev, initAudio, {once:true, passive:true}));
function beep(freq, when, dur, type, vol){
  if(!audioCtx) return;
  const t = audioCtx.currentTime + 0.03 + when;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type || "sine"; osc.frequency.value = freq;
  osc.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol||0.2, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  osc.start(t); osc.stop(t+dur+0.03);
}
function playCorrect(){            // ピンポン（明るい2音）
  if(!soundOn) return; initAudio();
  beep(1319, 0,    0.18, "sine", 0.22);
  beep(1047, 0.16, 0.42, "sine", 0.22);
}
function playWrong(){              // トゥルルル〜（低いブザー・ゆれる音）
  if(!soundOn) return; initAudio(); if(!audioCtx) return;
  const t = audioCtx.currentTime + 0.03;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  const lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
  osc.type = "square"; osc.frequency.value = 196;
  lfo.type = "sine"; lfo.frequency.value = 17; lg.gain.value = 55; // 細かいゆれ＝トゥルルル
  lfo.connect(lg); lg.connect(osc.frequency);
  osc.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.16, t+0.02);
  g.gain.setValueAtTime(0.16, t+0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.6);
  osc.start(t); lfo.start(t); osc.stop(t+0.62); lfo.stop(t+0.62);
}

/* 不規則動詞の活用形（強調用） */
const IRR = {
  be:["am","is","are","was","were","been","being","be"],
  take:["take","takes","taking","took","taken"],
  get:["get","gets","getting","got","gotten"],
  come:["come","comes","coming","came"],
  go:["go","goes","going","went","gone"],
  run:["run","runs","running","ran"],
  make:["make","makes","making","made"],
  fall:["fall","falls","falling","fell","fallen"],
  break:["break","breaks","breaking","broke","broken"],
  bring:["bring","brings","bringing","brought"],
  buy:["buy","buys","buying","bought"],
  catch:["catch","catches","catching","caught"],
  think:["think","thinks","thinking","thought"],
  find:["find","finds","finding","found"],
  give:["give","gives","giving","gave","given"],
  stand:["stand","stands","standing","stood"],
  sit:["sit","sits","sitting","sat"],
  put:["put","puts","putting"],
  hold:["hold","holds","holding","held"],
  wake:["wake","wakes","waking","woke","woken"],
  do:["do","does","doing","did","done"],
  have:["have","has","having","had"],
  hear:["hear","hears","hearing","heard"],
  feel:["feel","feels","feeling","felt"],
  leave:["leave","leaves","leaving","left"],
  meet:["meet","meets","meeting","met"],
  say:["say","says","saying","said"],
  tell:["tell","tells","telling","told"],
  grow:["grow","grows","growing","grew","grown"],
  speak:["speak","speaks","speaking","spoke","spoken"],

  keep:["keep","keeps","keeping","kept"],
  sleep:["sleep","sleeps","sleeping","slept"]
};

/* 例文中の見出し語・熟語を強調（活用・be動詞・所有格のゆれに対応） */
function highlightWord(sentence, word){
  try{
    const escAll = s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    // 1) そのままの語/句が含まれれば強調
    let re = new RegExp("("+escAll(word)+")","i");
    if(re.test(sentence)) return sentence.replace(re,"<b>$1</b>");
    // 2) 緩いマッチ
    const fn = {a:1,an:1,the:1,to:1,of:1,at:1,"in":1,on:1,with:1,"for":1,from:1,up:1,down:1,off:1,out:1,by:1,as:1,that:1,but:1,also:1,not:1,only:1};
    const parts = word.split(/\s+/).map(p=>{
      const low=p.toLowerCase();
      if(low==="one's")   return "(?:my|your|his|her|its|our|their)";
      if(low==="oneself") return "(?:myself|yourself|himself|herself|itself|ourselves|themselves)";
      if(IRR[low])        return "(?:"+IRR[low].map(escAll).join("|")+")";  // 不規則動詞
      if(fn[low])         return escAll(p);                                 // 機能語はそのまま
      const stem = p.replace(/(?:e|y)$/i,"");                               // 語末のe/yを落として語幹に
      return escAll(stem)+"\\w*";                                           // 規則変化を許容
    });
    re = new RegExp("("+parts.join("\\s+")+")","i");
    const m = sentence.match(re);
    return m ? sentence.replace(re,"<b>$1</b>") : sentence;
  }catch(e){ return sentence; }
}

/* ====== 苦手単語の判定（正答率60%未満かつ出題ずみ） ====== */
function isWeak(w){ const s=stats[w.word]; return !!(s && s.seen>0 && (s.correct/s.seen)<0.6); }
function weakWords(){ return WORDS.filter(isWeak); }

/* ====== ホーム描画 ====== */
function renderHome(){
  applySet();
  $("#statWords").textContent = WORDS.length;
  let seen=0, correct=0;
  WORDS.forEach(w=>{
    const s = stats[w.word];
    if(s && s.seen){ seen+=s.seen; correct+=s.correct; }
  });
  const weak = weakWords().length;
  $("#statAcc").textContent = seen ? Math.round(correct/seen*100)+"%" : "–";
  $("#statWeak").textContent = weak;

  // 「苦手だけ」ピルに件数を表示し、0件なら選べないように
  const wp = $("#weakPill");
  wp.textContent = "苦手だけ ("+weak+")";
  wp.disabled = weak===0;
  wp.style.opacity = weak===0 ? .45 : 1;
  if(weak===0 && rangeSel==="weak") selectRange("all");
}

/* ====== セッション開始 ====== */
function priority(w){
  const s = stats[w.word];
  if(!s || !s.seen) return 3;                       // 未出題は優先
  const acc = s.correct/s.seen;
  let p = 1 + (1-acc)*3;                             // 正答率が低いほど高い
  if(s.lastWrong && Date.now()-s.lastWrong < 6e5) p+=1; // 直近で誤答
  return p;
}
function buildQueue(sourcePool, n){
  const pool = sourcePool.slice();
  const picked = [];
  while(pool.length && picked.length<n){
    const weights = pool.map(priority);
    const total = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total, i=0;
    while(r>=weights[i]){ r-=weights[i]; i++; }
    picked.push(pool.splice(i,1)[0]);
  }
  return shuffle(picked);
}
function startSession(){
  if(WORDS.length<4){ alert("この単語帳には単語が4つ以上必要です。"); return; }
  initAudio();
  let pool = WORDS;
  if(rangeSel==="weak"){
    pool = weakWords();
    if(pool.length===0){
      alert("いまは苦手な単語がありません。まずは『すべての単語』で挑戦してみよう。");
      return;
    }
  }
  const n = countSel==="all" ? pool.length : Math.min(countSel, pool.length);
  queue = buildQueue(pool, n);
  idx = 0; sessionWrong = [];
  show("quiz");
  renderQuestion();
}

/* ====== 出題描画 ====== */
function wsize(t){ const n=t.length; return n>20?" xlong":n>11?" long":""; }
function makeChoices(correctWord){
  const sameType = WORDS.filter(w=>w.word!==correctWord.word && w.pos===correctWord.pos);
  const others   = WORDS.filter(w=>w.word!==correctWord.word && w.pos!==correctWord.pos);
  const pool = shuffle(sameType.slice()).concat(shuffle(others));
  const distractors = pool.slice(0,3).map(w=>w.meaning);
  return shuffle([correctWord.meaning, ...distractors]);
}
function renderQuestion(){
  answered = false;
  const w = queue[idx];
  $("#qCount").textContent = (idx+1)+" / "+queue.length;
  $("#qBar").style.width = (idx/queue.length*100)+"%";
  $("#feedback").textContent=""; $("#feedback").className="feedback";
  $("#example").style.display="none"; $("#example").innerHTML="";
  $("#nextBtn").style.display="none";

  const prompt = $("#prompt");
  if(mode==="listen"){
    prompt.innerHTML =
      '<button class="orb" id="orbBtn" aria-label="もう一度きく">'
      +'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.6 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.6 7-8.8s-3-7.8-7-8.8z"/></svg>'
      +'</button><button class="replay" id="replayBtn">タップして発音をきく</button>';
    $("#orbBtn").addEventListener("click",()=>speak(w.word));
    $("#replayBtn").addEventListener("click",()=>speak(w.word));
    setTimeout(()=>speak(w.word),250);
  } else {
    prompt.innerHTML = '<div class="word'+wsize(w.word)+'">'+w.word+'</div>'
      + (w.pos?'<div class="pos">'+w.pos+'</div>':'')
      + '<button class="word-spk" id="wordSpk" aria-label="発音をきく">🔊 発音をきく</button>'
      + '<div class="hint">意味をえらぼう</div>';
    $("#wordSpk").addEventListener("click",()=>speak(w.word));
  }

  const choices = makeChoices(w);
  const keys = ["A","B","C","D"];
  const box = $("#choices"); box.innerHTML="";
  choices.forEach((m,i)=>{
    const b = document.createElement("button");
    b.className="choice"; b.type="button";
    b.innerHTML='<span class="k">'+keys[i]+'</span><span>'+m+'</span>';
    b.addEventListener("click",()=>handleAnswer(b,m,w));
    box.appendChild(b);
  });
}

/* ====== 回答処理 ====== */
function handleAnswer(btn, chosen, w){
  if(answered) return;
  answered = true;
  const correct = chosen === w.meaning;

  const s = stats[w.word] || {seen:0,correct:0,lastWrong:0};
  s.seen++; if(correct) s.correct++; else s.lastWrong = Date.now();
  stats[w.word] = s; saveStats();

  document.querySelectorAll(".choice").forEach(c=>{
    const label = c.querySelector("span:last-child").textContent;
    c.disabled = true;
    if(label===w.meaning) c.classList.add("correct");
    else if(c===btn) c.classList.add("wrong");
  });

  // 発音モードでは、答え合わせのときに実際の単語を表示する
  if(mode==="listen"){
    speechSynthesis && speechSynthesis.cancel();
    $("#prompt").innerHTML =
      '<div class="word'+wsize(w.word)+'">'+w.word+'</div>'
      + (w.pos?'<div class="pos">'+w.pos+'</div>':'')
      + '<div class="hint">いまの発音はこの単語</div>';
  }

  const fb = $("#feedback");
  if(correct){ fb.textContent="正解！"; fb.className="feedback ok"; playCorrect(); }
  else{ fb.textContent="おしい！ 正解は「"+w.meaning+"」"; fb.className="feedback ng"; sessionWrong.push(w); playWrong(); }

  // 例文＋和訳（用意がある単語帳のみ）
  const exBox = $("#example");
  if(w.ex){
    exBox.innerHTML =
      '<button class="ex-spk" id="exSpk" aria-label="例文を聞く">🔊</button>'
      + '<div class="ex-en">'+highlightWord(w.ex, w.word)+'</div>'
      + '<div class="ex-ja">'+(w.ja||"")+'</div>';
    exBox.style.display="block";
    $("#exSpk").addEventListener("click",()=>speak(w.ex));
  } else {
    exBox.style.display="none";
  }

  // 次へボタン（最後の問題なら結果へ）
  const nb = $("#nextBtn");
  nb.textContent = (idx>=queue.length-1) ? "結果を見る" : "次へ";
  nb.style.display="block";

  $("#qBar").style.width = ((idx+1)/queue.length*100)+"%";
}
function next(){
  idx++;
  if(idx>=queue.length) finishSession();
  else renderQuestion();
}

/* ====== 結果 ====== */
function finishSession(){
  speechSynthesis && speechSynthesis.cancel();
  const total = queue.length;
  const wrong = sessionWrong.length;
  const right = total - wrong;
  const pct = Math.round(right/total*100);

  $("#rPct").textContent = pct+"%";
  $("#rFrac").textContent = right+" / "+total+" 問";
  const circ = 402, off = circ*(1-right/total);
  const ring = $("#rRing");
  ring.style.transition="none"; ring.style.strokeDashoffset=circ;
  ring.setAttribute("stroke", pct>=80?"#16B981":pct>=50?"#4A3DCB":"#FF9F45");

  let emoji,title,sub;
  if(pct===100){emoji="🏆";title="パーフェクト！";sub="全問正解。すばらしい集中力だね。";}
  else if(pct>=80){emoji="🎉";title="よくできた！";sub="この調子で苦手をつぶしていこう。";}
  else if(pct>=50){emoji="💪";title="あと少し！";sub="まちがえた単語をもう一度やってみよう。";}
  else{emoji="🌱";title="ここからだ！";sub="くり返すほど覚えられる。続けてみよう。";}
  $("#rEmoji").textContent=emoji; $("#rTitle").textContent=title; $("#rSub").textContent=sub;

  const list = $("#reviewList");
  if(sessionWrong.length){
    list.innerHTML="";
    sessionWrong.forEach(w=>{
      const row=document.createElement("div");
      row.className="review-item";
      row.innerHTML='<span class="w">'+w.word+'</span><span class="m">'+w.meaning+'</span>';
      list.appendChild(row);
    });
  } else {
    list.innerHTML='<div class="review-empty">まちがいなし！この回は全部正解だよ。</div>';
  }

  show("result");
  requestAnimationFrame(()=>{ ring.style.transition="stroke-dashoffset .9s ease"; ring.style.strokeDashoffset=off; });
}

/* ====== 単語リスト編集（自分のリスト） ====== */
function openEdit(){
  const custom = getCustomWords();
  const base = custom.length ? custom : DEFAULT_WORDS;
  $("#listInput").value = base.map(w=> w.pos ? `${w.word},${w.meaning},${w.pos}` : `${w.word},${w.meaning}`).join("\n");
  $("#editMsg").textContent="";
  show("edit");
}
function parseList(text){
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    const p=t.split(",").map(x=>x.trim());
    if(p[0] && p[1]) out.push({word:p[0], meaning:p[1], pos:p[2]||""});
  });
  return out;
}
function saveList(){
  const parsed = parseList($("#listInput").value);
  const msg = $("#editMsg");
  if(parsed.length<2){ msg.textContent="2語以上必要です（4択を作るため）。"; msg.className="edit-msg ng"; return; }
  localStorage.setItem(LS_WORDS, JSON.stringify(parsed));
  activeSet = CUSTOM_ID; localStorage.setItem(LS_SET, activeSet);   // 自分のリストに切り替え
  msg.textContent = parsed.length+"語を「自分のリスト」に保存しました。"; msg.className="edit-msg ok";
  populateSetSelect();
  renderHome();
  setTimeout(()=>{ show("home"); }, 800);
}

/* ====== イベント ====== */
document.querySelectorAll(".mode").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".mode").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    mode = b.dataset.mode;
  });
});
$("#countPills").addEventListener("click",e=>{
  const p=e.target.closest(".pill"); if(!p) return;
  $("#countPills").querySelectorAll(".pill").forEach(x=>x.setAttribute("aria-pressed","false"));
  p.setAttribute("aria-pressed","true");
  countSel = p.dataset.count==="all" ? "all" : parseInt(p.dataset.count,10);
});
function selectRange(r){
  rangeSel = r;
  $("#rangePills").querySelectorAll(".pill").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.range===r ? "true":"false"));
}
$("#rangePills").addEventListener("click",e=>{
  const p=e.target.closest(".pill"); if(!p || p.disabled) return;
  selectRange(p.dataset.range);
});
function populateSetSelect(){
  const sel = $("#setSelect");
  const custom = getCustomWords();
  if(activeSet!==CUSTOM_ID && !SETS.find(s=>s.id===activeSet)){ activeSet=SETS[0].id; localStorage.setItem(LS_SET,activeSet); }
  let html = SETS.map(s=>`<option value="${s.id}">${s.label}（${s.words.length}語）</option>`).join("");
  html += `<option value="${CUSTOM_ID}">自分のリスト${custom.length? "（"+custom.length+"語）":"（未作成）"}</option>`;
  sel.innerHTML = html;
  if(activeSet===CUSTOM_ID && custom.length<2){ activeSet="ex1"; localStorage.setItem(LS_SET,activeSet); }
  sel.value = activeSet;
}
$("#setSelect").addEventListener("change",e=>{
  const v=e.target.value;
  if(v===CUSTOM_ID && getCustomWords().length<2){
    alert("「自分のリスト」はまだありません。『自分のリストを編集』から作成してください。");
    e.target.value=activeSet; return;
  }
  activeSet=v; localStorage.setItem(LS_SET,activeSet);
  selectRange("all");   // 単語帳ごとに苦手語が変わるため範囲を初期化
  renderHome();
});
$("#startBtn").addEventListener("click",startSession);
$("#nextBtn").addEventListener("click",next);
function updateSoundBtn(){ $("#soundBtn").textContent = soundOn ? "🔊 効果音 ON" : "🔇 効果音 OFF"; }
$("#soundBtn").addEventListener("click",()=>{
  soundOn = !soundOn;
  localStorage.setItem(LS_SOUND, soundOn ? "on" : "off");
  updateSoundBtn();
  if(soundOn){ initAudio(); playCorrect(); }   // ONにしたら確認音
});
$("#quitBtn").addEventListener("click",()=>{ speechSynthesis&&speechSynthesis.cancel(); renderHome(); show("home"); });
$("#retryBtn").addEventListener("click",startSession);
$("#toHomeBtn").addEventListener("click",()=>{ renderHome(); show("home"); });
$("#editBtn").addEventListener("click",openEdit);
$("#editBack").addEventListener("click",()=>{ renderHome(); show("home"); });
$("#saveListBtn").addEventListener("click",saveList);
$("#loadDefaultBtn").addEventListener("click",()=>{
  $("#listInput").value = DEFAULT_WORDS.map(w=>`${w.word},${w.meaning},${w.pos}`).join("\n");
  $("#editMsg").textContent="サンプルを挿入しました（保存で確定）。"; $("#editMsg").className="edit-msg ok";
});
$("#resetBtn").addEventListener("click",()=>{
  if(confirm("通算の学習記録をすべて消しますか？")){ stats={}; saveStats(); renderHome(); }
});

/* キーボード（1-4 / A-D で回答、回答後は Enter/Space で次へ） */
document.addEventListener("keydown",e=>{
  if(!$("#quiz").classList.contains("active")) return;
  if(answered){
    if(e.key==="Enter" || e.key===" "){
      e.preventDefault();
      const nb=$("#nextBtn"); if(nb.style.display!=="none") nb.click();
    }
    return;
  }
  const map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  const i=map[e.key.toLowerCase()];
  if(i!=null){ const c=document.querySelectorAll(".choice")[i]; if(c) c.click(); }
});

/* 起動 */
updateSoundBtn();
populateSetSelect();
renderHome();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
